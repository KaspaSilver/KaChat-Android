# Gradle JVM memory — prevents garbage collector thrashing
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Build speed: run independent modules/tasks in parallel, reuse outputs across builds,
# and skip the configuration phase entirely when nothing about the build setup changed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Kotlin code style
kotlin.code.style=official

# Enable AndroidX
android.useAndroidX=true

# R8 full-mode optimization — default-on in AGP 8+, set explicitly so the release build's
# shrinking/optimization is unambiguous (addresses Play's "R8 optimization" quality recommendation).
android.enableR8.fullMode=true
