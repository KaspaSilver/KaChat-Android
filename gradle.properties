# Gradle JVM memory — prevents garbage collector thrashing
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Build speed: run independent modules/tasks in parallel, reuse outputs across builds,
# and skip the configuration phase entirely when nothing about the build setup changed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Suppress the compileSdk=35 warning for AGP 8.5.2
android.suppressUnsupportedCompileSdk=35

# Kotlin code style
kotlin.code.style=official

# Enable AndroidX
android.useAndroidX=true
